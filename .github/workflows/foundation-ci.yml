name: Foundation CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate foundation files
        run: python3 scripts/validate_foundation.py
      - name: Validate governed memory runtime
        run: python3 scripts/governed_memory_validate.py validate
